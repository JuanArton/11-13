<!DOCTYPE html>
<html lang="en" manifest="host.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #actions { display:none; gap:8px; margin-top:8px; }
  #actions.show { display:flex; }
  #actions button {
    flex:1; padding:12px 12px; border:1px solid #2a3542; border-radius:5px;
    background:#151b22; color:#e6ebf2; font:14px/1.2 "Segoe UI", system-ui, sans-serif;
    cursor:pointer;
  }
  #actions button:disabled { opacity:.45; cursor:default; }
  #updateBtn { color:#d8c07f; }
  #out { display:none; white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 160px); overflow-y:auto; margin-top:10px; }
  #out.show { display:block; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>محمود فتحي 01024388999</b></div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div id="actions">
    <button type="button" id="runBtn">Start exploit</button>
    <button type="button" id="updateBtn">Update cache</button>
  </div>
  <div id="out"></div>
</div>

<script>
(function () {
    var READY_KEY = "ps4cacheReady";
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var actionsEl = document.getElementById("actions");
    var outEl = document.getElementById("out");
    var runBtn = document.getElementById("runBtn");
    var updateBtn = document.getElementById("updateBtn");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var updating = false;
    var bound = false;
    var started = false;

    var key = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
    }
    var why = "";
    var fwOk = false;
    if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (key === "12.02" || key === "12.00") {
        fwOk = true;
        why = key + " lapse / 1200.bin";
    } else {
        why = key + " -- this host is 12.02 only";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; " + why;

    if (!fwOk) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var ac = window.applicationCache;

    function markReady() {
        try { localStorage.setItem(READY_KEY, "1"); } catch (e) {}
    }
    function wasReady() {
        try { return localStorage.getItem(READY_KEY) === "1"; } catch (e) { return false; }
    }
    function hideMenu() { actionsEl.className = ""; }
    function showMenu(cacheMsg) {
        if (started) return;
        markReady();
        updating = false;
        actionsEl.className = "show";
        runBtn.disabled = false;
        updateBtn.disabled = !ac || !navigator.onLine;
        setState("ready", "ok");
        if (cacheMsg) setCache(cacheMsg, true);
    }
    function go() {
        if (started) return;
        started = true;
        hideMenu();
        detEl.style.display = "none";
        cacheEl.style.display = "none";
        outEl.className = "show";
        setState("loading lapse chain...", "warn");
        var s = document.createElement("script");
        s.type = "module";
        s.src = "./chain_lapse.js";
        document.body.appendChild(s);
    }

    runBtn.addEventListener("click", go, false);
    updateBtn.addEventListener("click", function () {
        if (started || updating || !ac) return;
        if (!navigator.onLine) {
            setCache("offline -- cannot update");
            return;
        }
        updating = true;
        runBtn.disabled = true;
        updateBtn.disabled = true;
        setState("updating cache...", "warn");
        setCache("checking for latest files...");
        var xhr = new XMLHttpRequest();
        try {
            xhr.open("GET", "host.appcache?t=" + Date.now(), true);
            xhr.setRequestHeader("Cache-Control", "no-cache");
            xhr.onload = function () {
                try { ac.update(); } catch (e) {
                    updating = false;
                    showMenu("update failed -- try again");
                }
            };
            xhr.onerror = function () {
                try { ac.update(); } catch (e) {
                    updating = false;
                    showMenu("update failed -- try again");
                }
            };
            xhr.send();
        } catch (e) {
            try { ac.update(); } catch (err) {
                updating = false;
                showMenu("update failed -- try again");
            }
        }
    }, false);

    function bindAC(ac) {
        if (!ac || bound) return;
        bound = true;
        ac.addEventListener("downloading", function () {
            if (started) return;
            if (updating || !wasReady())
                setCache("downloading files...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (started) return;
            if (!(updating || !wasReady())) return;
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            if (started) return;
            markReady();
            setCache("cached for offline use", true);
            showMenu("cached -- Start exploit or Update cache");
        }, false);
        ac.addEventListener("noupdate", function () {
            if (started) return;
            if (updating) showMenu("already latest -- cached for offline");
        }, false);
        ac.addEventListener("updateready", function () {
            if (started) return;
            try { ac.swapCache(); } catch (e) {}
            markReady();
            setCache("update downloaded", true);
            setState("UPDATE READY -- reloading...", "ok");
            location.reload();
        }, false);
        ac.addEventListener("error", function () {
            if (started) return;
            if (wasReady()) {
                updating = false;
                showMenu("cache update failed -- Start exploit still works");
                return;
            }
            setCache("cache failed");
            setState("CACHE FAILED", "bad");
        }, false);
        ac.addEventListener("obsolete", function () {
            if (started) return;
            try { localStorage.removeItem(READY_KEY); } catch (e) {}
            setCache("old cache dropped -- reloading to fetch the new one");
            setState("CACHE OBSOLETE -- reloading...", "warn");
            hideMenu();
            setTimeout(function () { location.reload(); }, 400);
        }, false);

        var idle = ac.status === ac.IDLE;
        var uncached = ac.status === ac.UNCACHED;
        if (wasReady() || idle) {
            if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) {}
                location.reload();
                return;
            }
            if (!navigator.onLine)
                showMenu("offline -- from cache");
            else
                showMenu("cached -- Start exploit or Update cache");
            return;
        }
        hideMenu();
        if (!navigator.onLine) {
            setCache("offline and no cache yet");
            setState("OFFLINE", "bad");
            return;
        }
        setState("caching for first run...", "warn");
        setCache("starting cache...");
        if (!(uncached || ac.status === ac.CHECKING || ac.status === ac.DOWNLOADING)) {
            try { ac.update(); } catch (e) {}
        }
    }

    bindAC(ac);
})();
</script>
</body>
</html>
